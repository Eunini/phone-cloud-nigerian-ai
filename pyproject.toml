[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-cloud-nigerian-ai"
version = "0.1.0"
description = "Reproducible African-language AI experiments with explicit evidence status"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "datasets>=3.6,<4", "huggingface-hub>=0.34,<1", "psutil>=7,<8", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
translation = ["torch>=2.5,<3", "transformers>=4.45,<5", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
